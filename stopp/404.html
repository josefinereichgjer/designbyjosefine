<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Side ikke funnet — Stoppestedet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: #C8E600;
      color: #0a0a0a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .num {
      font-family: 'Syne', sans-serif;
      font-size: clamp(80px, 20vw, 180px);
      font-weight: 700;
      line-height: 1;
      color: #0a0a0a;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(20px, 4vw, 36px);
      font-weight: 500;
      margin-top: 16px;
    }
    p {
      font-size: 16px;
      line-height: 1.65;
      color: #333;
      margin-top: 12px;
      max-width: 400px;
    }
    a {
      display: inline-block;
      margin-top: 32px;
      background: #0a0a0a;
      color: #fff;
      font-family: 'IBM Plex Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 14px 28px;
      text-decoration: none;
    }
    a:hover { background: #333; }
  </style>
</head>
<body>
  <p class="num">404</p>
  <h1>Siden finnes ikke</h1>
  <p>Det ser ut til at du har gått deg vill. Siden du leter etter eksisterer ikke eller har blitt flyttet.</p>
  <a href="index.html">Tilbake til forsiden</a>
</body>
</html>
