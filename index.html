<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DesignbyJosefine</title>
  <meta name="description" content="Portfolio — branding, typografi og illustrasjon." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="./assets/me.webp" as="image">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/hvitlogo.webp">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>

  <style>
    @font-face {
      font-family: "Romie";
      src: url("./assets/Romie-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      height: 100%; overflow: hidden;
      font-family: "Poppins", system-ui, sans-serif;
      background: #000;
    }

    /* ── Full-screen stage ── */
    .landing {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
      contain: strict;
    }

    /* ── 4-directional vignette — text protection on all edges ── */
    .landing::before,
    .landing::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }
    /* Left strong + top + bottom */
    .landing::before {
      background:
        linear-gradient(to right,  rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 14%, transparent 34%),
        linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 24%),
        linear-gradient(to top,    rgba(0,0,0,0.90) 0%, transparent 42%);
    }
    /* Right edge */
    .landing::after {
      background: linear-gradient(to left, rgba(0,0,0,0.75) 0%, transparent 22%);
    }

    /* ── Collage fills the whole page ── */
    .collage-scene {
      position: absolute;
      inset: 0;
    }

    /* Cards rendered by collage.js */
    .collage-card {
      position: absolute;
      cursor: pointer;
      border-radius: 0;
      overflow: hidden;
      touch-action: manipulation;
      box-shadow:
        0 2px  6px  rgba(0,0,0,.07),
        0 8px  28px rgba(0,0,0,.11),
        0 22px 52px rgba(0,0,0,.08);
      will-change: transform, opacity;
      transition: box-shadow .3s ease;
    }
    .collage-card:hover {
      box-shadow:
        0 4px  10px rgba(0,0,0,.10),
        0 18px 44px rgba(0,0,0,.17),
        0 36px 76px rgba(0,0,0,.13);
    }
    .collage-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      pointer-events: none; user-select: none;
      -webkit-user-drag: none;
      filter: brightness(.96) saturate(1.04);
      transition: filter .3s ease;
    }
    .collage-card:hover img {
      filter: brightness(1) saturate(1.08);
    }

    /* ── Top-left block ── */
    .landing__topleft {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      opacity: 1;
    }

    /* ── "Portfolio" — top-left, big, links to the portfolio ── */
    .landing__portfolio-link {
      z-index: 50;
      font-family: "Romie", Georgia, serif;
      font-size: clamp(46px, 15vw, 80px);
      font-weight: 400;
      letter-spacing: 0.07em;
      line-height: 1;
      color: #fff;
      text-decoration: none;
    }
    .landing__portfolio-link:hover { opacity: .7; }

    /* ── CTA + bio — bottom-left ── */
    .landing__brand {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      pointer-events: none;
      opacity: 1;
    }

    /* Mobile: show short variants, hide full */
    .landing__cta-label--short { display: inline; }
    .landing__cta-label--full { display: none; }
    .landing__bio--short { display: inline; }
    .landing__bio--full { display: none; }

    .landing__cta {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 0;
      border-radius: 0;
      background: none;
      border: none;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity .2s ease;
      pointer-events: auto;
      z-index: 50;
    }
    .landing__cta:hover { opacity: 0.7; }
    .landing__cta:active { transform: scale(0.98); }
    .landing__cta { touch-action: manipulation; }

    /* ── Bio ── */
    .landing__bio {
      max-width: min(100%, 460px);
      font-family: "Poppins", sans-serif;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.65;
      letter-spacing: 0.01em;
      color: rgba(255,255,255,0.75);
      overflow-wrap: break-word;
    }

    /* ── Mobile base (< 768px) ── */
    .collage-scene { transform: scale(0.70); transform-origin: center; }
    .landing__portfolio-link { font-size: clamp(32px, 9.5vw, 62px); }
    .landing__brand {
      gap: 12px;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
    }

    /* ── CTA arrow ── */
    .landing__cta-arrow {
      flex-shrink: 0;
      overflow: visible;
      transition: transform .32s cubic-bezier(0.25,0.46,0.45,0.94), opacity .28s ease;
    }
    .landing__cta:hover .landing__cta-arrow { transform: translateX(6px); }
    .landing__cta.is-leaving .landing__cta-arrow {
      transform: translateX(180px);
      opacity: 0;
      transition: transform .38s cubic-bezier(0.4,0,1,1), opacity .22s ease;
    }

    /* ── Mobile intro letters (< 768px) — bigger + less clipped ── */
    @media (max-width: 767px) {
      /* J */ .intro-letter:nth-child(1) { font-size: min(44vw, 400px); }
      /* O */ .intro-letter:nth-child(2) { top: -3vh; font-size: min(42vw, 375px); }
      /* S */ .intro-letter:nth-child(3) { font-size: min(32vw, 290px); }
      /* E */ .intro-letter:nth-child(4) { font-size: min(28vw, 260px); }
      /* F */ .intro-letter:nth-child(5) { font-size: min(42vw, 375px); }
      /* I */ .intro-letter:nth-child(6) { font-size: min(50vw, 460px); }
      /* N */ .intro-letter:nth-child(7) { font-size: min(36vw, 320px); }
      /* E */ .intro-letter:nth-child(8) { font-size: min(42vw, 375px); }
    }

    /* ── Tiny phones (< 480px) ── */
    @media (max-width: 479px) {
      .collage-scene { transform: scale(0.62); }
      .landing__portfolio-link { font-size: clamp(28px, 9vw, 48px); }
    }

    /* ── Landscape phones — short viewport ── */
    @media (max-height: 500px) and (orientation: landscape) {
      .landing__topleft { top: 10px; left: 14px; }
      .landing__portfolio-link { font-size: clamp(20px, 5vh, 34px) !important; }
      .landing__brand { bottom: 10px; top: auto; transform: none; gap: 8px; }
      .landing__bio { font-size: 11px; line-height: 1.4; max-width: 48vw; }
      .landing__cta { font-size: 10px; margin-left: 0; margin-top: 8px; }
      .collage-scene { transform: scale(0.52) translateX(14%); }
    }

    /* ── Tablet portrait + landscape (768px+) ── */
    @media (min-width: 768px) {
      .landing__topleft { top: 28px; left: 28px; }
      .landing__brand {
        left: 28px; right: auto;
        bottom: auto; top: 50%;
        transform: translateY(-50%);
        gap: 20px;
      }
      .landing__portfolio-link { font-size: clamp(76px, 12vw, 124px); }
      .landing__cta-label--full  { display: inline; }
      .landing__cta-label--short { display: none; }
      .landing__bio--full  { display: inline; }
      .landing__bio--short { display: none; }
      .landing__bio { font-size: clamp(14px, 1.8vw, 20px); max-width: min(400px, 38vw); line-height: 1.55; }
      /* CTA indented and below bio with natural gap */
      .landing__cta { font-size: 11px; margin-top: 24px; margin-left: min(240px, 32vw); }
      .collage-scene { transform: scale(1.25) translateX(16%); transform-origin: center; }
    }

    /* ── Tablet portrait only — pile shifted more to not crowd text ── */
    @media (min-width: 768px) and (max-width: 1023px) and (orientation: portrait) {
      .collage-scene { transform: scale(1.15) translateX(20%); }
    }

    /* ── Desktop (1024px+) ── */
    @media (min-width: 1024px) {
      .landing__topleft { top: 36px; left: 44px; }
      .landing__brand { left: 44px; top: 50%; transform: translateY(-50%); gap: 24px; }
      .landing__portfolio-link { font-size: clamp(108px, 10vw, 168px); }
      .landing__bio { font-size: clamp(17px, 1.7vw, 26px); max-width: min(480px, 36vw); line-height: 1.45; }
      /* Move CTA lower — positive margin-top, indented to right of bio */
      .landing__cta { font-size: 18px; margin-top: 32px; margin-left: min(290px, 28vw); }
      .collage-scene { transform: scale(0.95) translateX(6%); transform-origin: center; }
    }

    /* ── Large desktop (1440px+) ── */
    @media (min-width: 1440px) {
      .landing__portfolio-link { font-size: clamp(136px, 11vw, 196px); }
      .landing__bio { font-size: clamp(20px, 1.8vw, 30px); max-width: min(540px, 34vw); }
      .landing__cta { font-size: 18px; margin-top: 36px; margin-left: min(340px, 25vw); }
      .collage-scene { transform: scale(1.30) translateX(8%); }
    }

    /* ── XL (1920px+) ── */
    @media (min-width: 1920px) {
      .landing__portfolio-link { font-size: clamp(136px, 9vw, 158px); }
      .landing__bio { font-size: clamp(20px, 1.6vw, 28px); max-width: min(540px, 32vw); }
      .landing__cta { font-size: 18px; margin-top: 36px; margin-left: min(340px, 22vw); }
      .collage-scene { transform: scale(1.25) translateX(4%); }
    }

    /* ── Ultra-wide (2200px+): keep text proportionally spaced from edge ── */
    @media (min-width: 2200px) {
      .landing__topleft { left: max(44px, 5vw); }
      .landing__brand   { left: max(44px, 5vw); }
      .landing__portfolio-link { font-size: clamp(160px, 9vw, 240px); }
      .landing__bio { font-size: clamp(26px, 1.8vw, 40px); max-width: min(640px, 28vw); }
      .landing__cta { font-size: 20px; margin-top: 44px; margin-left: min(400px, 18vw); }
      .collage-scene { transform: scale(1.85) translateX(12%); }
    }

    /* ── Nav menu landscape ── */
    @media (max-height: 500px) {
      .nav-menu { align-items: flex-start; padding-top: 56px; }
      .nav-menu__link { font-size: clamp(28px, 8vh, 80px); }
      .nav-menu__list { gap: clamp(2px, 1vh, 10px); }
    }

    /* ── Hamburger button ── */
    .nav-toggle {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 450;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-end;
    }
    .nav-toggle__bar {
      display: block;
      height: 1px;
      background: #fff;
      transition: transform 0.32s ease, opacity 0.2s ease, width 0.32s ease;
    }
    .nav-toggle__bar:nth-child(1) { width: 22px; }
    .nav-toggle__bar:nth-child(2) { width: 14px; }
    .nav-toggle__bar:nth-child(3) { width: 22px; }

    .nav-toggle.is-open .nav-toggle__bar:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
      width: 22px;
    }
    .nav-toggle.is-open .nav-toggle__bar:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }
    .nav-toggle.is-open .nav-toggle__bar:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
      width: 22px;
    }

    /* ── Nav overlay ── */
    .nav-menu {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: #000;
      display: flex;
      align-items: center;
      padding: 0 clamp(28px, 8vw, 100px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s ease;
    }
    .nav-menu.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-menu__list {
      list-style: none;
      margin: 0; padding: 0;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 2.5vh, 20px);
    }

    .nav-menu__link {
      font-family: "Romie", Georgia, serif;
      font-size: clamp(42px, 10vw, 130px);
      font-weight: 400;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.03em;
      line-height: 1.05;
      display: block;
      transition: opacity 0.2s;
    }
    .nav-menu__link:hover { opacity: 0.38; }

    /* ── Intro overlay ── */
    #intro {
      position: absolute;
      inset: 0;
      z-index: 200;
      background: #000;
      overflow: hidden;
    }
    .intro-letter {
      position: absolute;
      font-family: "Romie", Georgia, serif;
      font-weight: 400;
      color: #fff;
      line-height: 0.82;
      user-select: none;
      pointer-events: none;
      will-change: transform, opacity;
      opacity: 0;
    }
    /* J */ .intro-letter:nth-child(1) { left: -2vw;  top:  5vh; font-size: min(28vw, 400px); }
    /* O */ .intro-letter:nth-child(2) { left: 15vw;  top: -9vh; font-size: min(26vw, 375px); }
    /* S */ .intro-letter:nth-child(3) { left: 52vw;  top:  7vh; font-size: min(20vw, 290px); }
    /* E */ .intro-letter:nth-child(4) { left: 70vw;  top: 20vh; font-size: min(18vw, 260px); }
    /* F */ .intro-letter:nth-child(5) { left:  5vw;  top: 52vh; font-size: min(26vw, 375px); }
    /* I */ .intro-letter:nth-child(6) { left: 28vw;  top: 44vh; font-size: min(32vw, 460px); }
    /* N */ .intro-letter:nth-child(7) { left: 48vw;  top: 55vh; font-size: min(22vw, 320px); }
    /* E */ .intro-letter:nth-child(8) { left: 70vw;  top: 62vh; font-size: min(26vw, 375px); }

  </style>
</head>

<body>
  <main class="landing">

    <div id="intro" aria-hidden="true">
      <span class="intro-letter">J</span>
      <span class="intro-letter">O</span>
      <span class="intro-letter">S</span>
      <span class="intro-letter">E</span>
      <span class="intro-letter">F</span>
      <span class="intro-letter">I</span>
      <span class="intro-letter">N</span>
      <span class="intro-letter">E</span>
    </div>

    <div class="collage-scene" id="collage-scene" aria-hidden="true"></div>

    <div class="landing__topleft">
      <a class="landing__portfolio-link" href="./projects.html">PORTFOLIO</a>
    </div>

    <div class="landing__brand">
      <p class="landing__bio">
        <span class="landing__bio--full"></span>
        <span class="landing__bio--short"></span>
      </p>
      <a class="landing__cta" href="./projects.html">
        <span class="landing__cta-label--full">Se arbeidene mine</span><span class="landing__cta-label--short">Arbeider</span>
        <svg class="landing__cta-arrow" width="48" height="10" viewBox="0 0 48 10" fill="none" aria-hidden="true">
          <line x1="0" y1="5" x2="41" y2="5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
          <path d="M 37 1.5 L 43 5 L 37 8.5" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>

  </main>

  <button class="nav-toggle" aria-label="Åpne meny" aria-expanded="false" aria-controls="nav-menu">
    <span class="nav-toggle__bar"></span>
    <span class="nav-toggle__bar"></span>
    <span class="nav-toggle__bar"></span>
  </button>

  <nav class="nav-menu" id="nav-menu" aria-hidden="true">
    <ul class="nav-menu__list">
      <li><a class="nav-menu__link" href="./projects.html">Arbeider</a></li>
      <li><a class="nav-menu__link" href="./projects.html#about">Om</a></li>
      <li><a class="nav-menu__link" href="mailto:josefinegjertsen@gmail.com">Kontakt</a></li>
    </ul>
  </nav>

  <script src="./intro.js" defer></script>
  <script src="./collage.js?v=1" defer></script>
  <script>
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var menu   = document.querySelector('.nav-menu');
      if (!toggle || !menu) return;

      function open() {
        menu.classList.add('is-open');
        toggle.classList.add('is-open');
        toggle.setAttribute('aria-expanded', 'true');
        menu.setAttribute('aria-hidden', 'false');
        toggle.setAttribute('aria-label', 'Lukk meny');
      }
      function close() {
        menu.classList.remove('is-open');
        toggle.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        menu.setAttribute('aria-hidden', 'true');
        toggle.setAttribute('aria-label', 'Åpne meny');
      }

      toggle.addEventListener('click', function () {
        menu.classList.contains('is-open') ? close() : open();
      });

      menu.querySelectorAll('.nav-menu__link').forEach(function (link) {
        link.addEventListener('click', close);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });
    })();
  </script>
</body>
</html>
