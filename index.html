<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DesignbyJosefine</title>
  <meta name="description" content="Portfolio — grafisk design, visuell identitet og typografi." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="./assets/reinalys.webp" as="image">
  <link rel="icon" href="assets/hvitlogo.webp">

  <style>
    @font-face {
      font-family: "Romie";
      src: url("./assets/Romie-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      height: 100%;
      font-family: "Poppins", system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      overflow: hidden;
    }

    /* ── Page shell ── */
    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 0.55s ease 0.08s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(20px, 3vh, 32px) clamp(24px, 4vw, 52px);
      flex-shrink: 0;
    }

    .logo {
      font-family: "Poppins", sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
    }
    .logo:hover { opacity: 0.6; }

    /* ── Main content ── */
    .main-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr clamp(300px, 32vw, 480px);
      gap: clamp(32px, 5vw, 96px);
      padding: 0 clamp(24px, 4vw, 52px);
      align-items: center;
      min-height: 0;
      overflow: hidden;
    }

    /* ── Left column ── */
    .display-text {
      font-family: "Romie", Georgia, serif;
      font-size: clamp(42px, 5.4vw, 86px);
      font-weight: 400;
      line-height: 1.06;
      letter-spacing: -0.01em;
      margin: 0 0 clamp(32px, 4.5vh, 56px);
    }
    .display-text span { display: block; }

    .action-row {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.5vw, 36px);
    }

    .btn-primary {
      display: inline-block;
      padding: 14px 36px;
      border: 1.5px solid rgba(255,255,255,0.8);
      border-radius: 999px;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .btn-primary:hover {
      background: #fff;
      color: #0f0f0f;
      border-color: #fff;
      opacity: 1;
    }

    .btn-text {
      color: rgba(255,255,255,0.5);
      font-family: "Poppins", sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-text:hover { color: #fff; opacity: 1; }

    /* ── Right column: floating cards ── */
    .col-right {
      position: relative;
      height: clamp(320px, 46vh, 500px);
      flex-shrink: 0;
    }

    .float-card {
      position: absolute;
      width: 62%;
      aspect-ratio: 3/4;
      overflow: hidden;
      display: block;
      text-decoration: none;
      box-shadow:
        0 8px 24px rgba(0,0,0,0.5),
        0 24px 64px rgba(0,0,0,0.45);
      transition:
        transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        box-shadow 0.45s ease;
      will-change: transform;
    }

    .float-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.82);
      transition: filter 0.45s ease;
    }

    .float-card__name {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 40px 16px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.68));
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.06em;
    }

    /* Stacked fan arrangement */
    .float-card--1 { left: 2%;  top: 8%;  transform: rotate(-6deg);   z-index: 1; }
    .float-card--2 { left: 20%; top: 0%;  transform: rotate(1.5deg);  z-index: 3; }
    .float-card--3 { left: 38%; top: 12%; transform: rotate(7deg);    z-index: 2; }

    @media (hover: hover) {
      .float-card:hover {
        transform: rotate(0deg) translateY(-14px) scale(1.04);
        box-shadow:
          0 12px 36px rgba(0,0,0,0.5),
          0 36px 90px rgba(0,0,0,0.65);
        z-index: 10;
      }
      .float-card:hover img { filter: brightness(1); }
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      padding: clamp(16px, 2.5vh, 26px) clamp(24px, 4vw, 52px);
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .email-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin: 0 0 10px;
    }

    .email-form {
      display: flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      padding: 7px 7px 7px 16px;
      width: fit-content;
      gap: 10px;
    }

    .email-icon { flex-shrink: 0; opacity: 0.35; }

    .email-form input {
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 13px;
      width: 210px;
    }
    .email-form input::placeholder { color: rgba(255,255,255,0.26); }

    .email-submit {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      font-size: 15px;
      line-height: 1;
      transition: background 0.2s, color 0.2s;
    }
    .email-submit:hover { background: rgba(255,255,255,0.22); color: #fff; opacity: 1; }

    /* ── Mobile ── */
    @media (max-width: 820px) {
      html, body { overflow: auto; }
      .page { height: auto; min-height: 100vh; }
      .main-content {
        grid-template-columns: 1fr;
        padding-top: 24px;
        padding-bottom: 40px;
        align-items: flex-start;
        gap: 48px;
        overflow: visible;
      }
      .display-text { font-size: clamp(38px, 9vw, 58px); }
      .col-right { height: clamp(260px, 55vw, 360px); }
      .float-card { width: 56%; }
    }

    @media (max-height: 680px) and (min-width: 821px) {
      .display-text { font-size: clamp(32px, 4.2vw, 62px); margin-bottom: 28px; }
      .col-right { height: clamp(260px, 38vh, 380px); }
    }

    @media (min-width: 2400px) {
      .main-content { max-width: 2400px; margin-left: auto; margin-right: auto; }
      .top-bar, .bottom-bar { max-width: 2400px; margin-left: auto; margin-right: auto; }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="top-bar">
      <a class="logo" href="./index.html">Josefine Gjertsen</a>
    </header>

    <div class="main-content">

      <!-- Left -->
      <div class="col-left">
        <h1 class="display-text">
          <span>Visuell identitet</span>
          <span>Redaksjonelt design</span>
          <span>Digitale opplevelser</span>
        </h1>
        <div class="action-row">
          <a class="btn-primary" href="./projects.html">Prosjekter</a>
          <a class="btn-text" href="./projects.html#about">Om meg</a>
        </div>
      </div>

      <!-- Right: floating photo cards -->
      <div class="col-right">
        <a class="float-card float-card--1" href="./reina-fruktgard.html">
          <img src="./assets/reinalys.webp" alt="Reina Fruktgård" loading="eager" decoding="async">
          <div class="float-card__name">Reina Fruktgård</div>
        </a>
        <a class="float-card float-card--2" href="./we-visuell-profil.html">
          <img src="./assets/lillawenettside.webp" alt="WE Visuell profil" loading="lazy" decoding="async">
          <div class="float-card__name">WE Visuell profil</div>
        </a>
        <a class="float-card float-card--3" href="./tidsskrift.html">
          <img src="./assets/krit1.webp" alt="Tidsskrift" loading="lazy" decoding="async">
          <div class="float-card__name">Tidsskrift</div>
        </a>
      </div>

    </div>

    <!-- Bottom: email -->
    <div class="bottom-bar">
      <p class="email-label">Hold deg oppdatert</p>
      <div class="email-form">
        <svg class="email-icon" width="14" height="11" viewBox="0 0 14 11" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="13" height="10" rx="1" stroke="currentColor"/>
          <path d="M1 1l6 4.5L13 1" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="email" placeholder="Din e-post" aria-label="E-postadresse">
        <a href="mailto:josefinegjertsen@gmail.com" class="email-submit" aria-label="Send">&#8594;</a>
      </div>
    </div>

  </div>

</body>
</html>
