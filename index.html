<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DesignbyJosefine</title>
  <meta name="description" content="Portfolio — branding, typografi og illustrasjon." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="./assets/me.webp" as="image">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@300;600;700&family=Caveat:wght@400&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/hvitlogo.webp">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      height: 100%; overflow: hidden;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: #000;
    }

    /* ── Full-screen stage ── */
    .landing {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    /* Edge fades */
    .landing::before,
    .landing::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 12vw;
      max-width: 140px;
      z-index: 5;
      pointer-events: none;
    }
    .landing::before {
      left: 0;
      background: linear-gradient(to right, #000, transparent);
    }
    .landing::after {
      right: 0;
      background: linear-gradient(to left, #000, transparent);
    }

    /* ── Collage fills the whole page ── */
    .collage-scene {
      position: absolute;
      inset: 0;
    }

    /* Cards rendered by collage.js */
    .collage-card {
      position: absolute;
      cursor: pointer;
      border-radius: 0;
      overflow: hidden;
      box-shadow:
        0 2px  6px  rgba(0,0,0,.07),
        0 8px  28px rgba(0,0,0,.11),
        0 22px 52px rgba(0,0,0,.08);
      will-change: transform, opacity;
      transition: box-shadow .3s ease;
    }
    .collage-card:hover {
      box-shadow:
        0 4px  10px rgba(0,0,0,.10),
        0 18px 44px rgba(0,0,0,.17),
        0 36px 76px rgba(0,0,0,.13);
    }
    .collage-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      pointer-events: none; user-select: none;
      -webkit-user-drag: none;
      filter: brightness(.96) saturate(1.04);
      transition: filter .3s ease;
    }
    .collage-card:hover img {
      filter: brightness(1) saturate(1.08);
    }

    /* ── Top-left block ── */
    .landing__topleft {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      opacity: 0;
    }

    /* ── "Portfolio" — top-left, big, links to the portfolio ── */
    .landing__portfolio-link {
      z-index: 50;
      font-family: "Poppins", sans-serif;
      font-size: 58px;
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
      color: #fff;
      text-decoration: none;
    }
    .landing__portfolio-link:hover { opacity: .7; }
    .landing__portfolio-link:hover .landing__name { opacity: .7; }

    .landing__name {
      display: flex;
      align-items: center;
      font-family: "Caveat", cursive;
      font-size: 36px;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: #fff;
      margin-top: 6px;
    }

    .landing__wip {
      display: block;
      font-family: "Poppins", sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #bcd8f0;
      margin-top: 4px;
    }

    .landing__logo-between {
      display: inline-block;
      width: clamp(36px, 4.5vw, 60px);
      height: auto;
      margin-left: 8px;
      vertical-align: top;
    }

    /* ── CTA + bio — bottom-left ── */
    .landing__brand {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      pointer-events: none;
      opacity: 0;
    }

    .landing__logo {
      width: clamp(130px, 14vw, 190px);
      height: auto;
      display: block;
    }

    /* Mobile: show short variants, hide full */
    .landing__logo-mobile { display: inline-block; vertical-align: middle; margin-left: 8px; }
    .landing__logo-desktop { display: none; }
    .landing__cta-label--short { display: inline; }
    .landing__cta-label--full { display: none; }
    .landing__bio--short { display: inline; }
    .landing__bio--full { display: none; }

    .landing__cta {
      margin-top: 10px;
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 6px 20px;
      border-radius: 0;
      background: none;
      border: none;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      pointer-events: all;
      position: relative;
      overflow: hidden;
      transition: opacity .2s ease;
    }
    .landing__cta:hover { opacity: 0.7; }
    .landing__cta:active { transform: scale(0.98); }

    /* arrow track — clips overflow so arrow can slide out */
    .landing__cta-arrow-track {
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      width: 48px;
      flex-shrink: 0;
    }
    .landing__cta-arrow {
      flex-shrink: 0;
      transition: transform .38s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .landing__cta:hover .landing__cta-arrow { transform: translateX(6px); }
    /* click burst state — added by JS */
    .landing__cta.is-leaving,
    .landing__cta.is-leaving .landing__cta-arrow-track {
      overflow: visible;
    }
    .landing__cta.is-leaving .landing__cta-arrow {
      transform: translateX(180px);
      opacity: 0;
      transition: transform .38s cubic-bezier(0.4,0,1,1), opacity .28s ease .1s;
    }

    /* ── Bio ── */
    .landing__bio {
      max-width: none;
      font-family: "Poppins", sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.75;
      letter-spacing: 0.01em;
      color: rgba(255,255,255,0.75);
      overflow-wrap: break-word;
    }

    /* Mobile collage */
    .collage-scene { transform: scale(.72); transform-origin: center; }

    /* ── Tablet (768px+) ── */
    @media (min-width: 768px) {
      .landing__topleft { top: 28px; left: 28px; }
      .landing__brand { left: 28px; bottom: 28px; right: auto; }
      .landing__portfolio-link { font-size: 108px; }
      .landing__name { font-size: 46px; display: block; }
      .landing__wip { font-size: 34px; }
      .landing__logo-desktop { display: inline-block; }
      .landing__logo-mobile { display: none; }
      .landing__cta-label--full { display: inline; }
      .landing__cta-label--short { display: none; }
      .landing__bio--full { display: inline; }
      .landing__bio--short { display: none; }
      .landing__bio { font-size: 17px; max-width: 520px; line-height: 1.5; }
      .landing__cta { font-size: 27px; padding: 6px 20px; margin-top: 0; }
      .collage-scene { transform: scale(1.4) translateX(-22%); transform-origin: center; }
    }

    /* ── Small desktop (1024px+) ── */
    @media (min-width: 1024px) {
      .landing__topleft { top: 36px; left: 44px; }
      .landing__brand { left: 44px; bottom: 44px; top: auto; transform: none; }
      .landing__portfolio-link { font-size: clamp(52px, 7vw, 96px); }
      .landing__name { font-size: clamp(32px, 3vw, 48px); }
      .landing__wip { font-size: clamp(20px, 2.4vw, 32px); }
      .landing__bio { font-size: clamp(12px, 0.9vw, 14px); max-width: 420px; line-height: 1.75; }
      .landing__cta { font-size: 15px; padding: 0; margin-top: 4px; }
      .collage-scene { transform: scale(.92); transform-origin: center; }
    }

    /* Keep tablet collage on portrait (e.g. iPad portrait at 1024px) */
    @media (min-width: 768px) and (orientation: portrait) {
      .collage-scene { transform: scale(1.4) translateX(-22%); transform-origin: center; }
    }

    /* ── Large desktop (1440px+) ── */
    @media (min-width: 1440px) {
      .landing__bio { font-size: 18px; max-width: 560px; }
      .landing__cta { font-size: 15px; padding: 0; }
      .collage-scene { transform: scale(1.2); }
    }

    /* ── XL desktop (1920px+) ── */
    @media (min-width: 1920px) {
      .landing__bio { font-size: 19px; max-width: 620px; }
      .landing__cta { font-size: 15px; padding: 0; }
      .collage-scene { transform: scale(1.45); }
    }
  </style>
</head>

<body>
  <main class="landing">

    <!-- Cards injected here by collage.js -->
    <div class="collage-scene" id="collage-scene" aria-hidden="true"></div>

    <!-- Top-left block -->
    <div class="landing__topleft">
      <a class="landing__portfolio-link" href="./projects.html">PORTFOLIO<span class="landing__name">JOSEFINE REICHELT GJERTSEN</span></a>    </div>

    <!-- Bottom-left: bio + button -->
    <div class="landing__brand">
      <p class="landing__bio">
        <span class="landing__bio--full"></span>
        <span class="landing__bio--short"></span>
      </p>
      <a class="landing__cta" href="./projects.html">
        <span class="landing__cta-label--full">Se arbeidene mine</span><span class="landing__cta-label--short">Arbeider</span>
        <span class="landing__cta-arrow-track" aria-hidden="true">
          <svg class="landing__cta-arrow" width="48" height="12" viewBox="0 0 48 12" fill="none">
            <line x1="0" y1="6" x2="40" y2="6" stroke="currentColor" stroke-width="1"/>
            <polyline points="35,1 41,6 35,11" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </span>
      </a>
    </div>

  </main>

  <script src="./collage.js?v=1" defer></script>
</body>
</html>
