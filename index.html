<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DesignbyJosefine</title>
  <meta name="description" content="Portfolio — branding, typografi og illustrasjon." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="./assets/me.webp" as="image">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/hvitlogo.webp">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      height: 100%; overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #000;
    }

    /* ── Full-screen stage ── */
    .landing {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #000;
    }

    /* Edge fades */
    .landing::before,
    .landing::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 12vw;
      max-width: 140px;
      z-index: 5;
      pointer-events: none;
    }
    .landing::before {
      left: 0;
      background: linear-gradient(to right, #000, transparent);
    }
    .landing::after {
      right: 0;
      background: linear-gradient(to left, #000, transparent);
    }

    /* ── Collage fills the whole page ── */
    .collage-scene {
      position: absolute;
      inset: 0;
    }

    /* Cards rendered by collage.js */
    .collage-card {
      position: absolute;
      cursor: pointer;
      border-radius: 0;
      overflow: hidden;
      box-shadow:
        0 2px  6px  rgba(0,0,0,.07),
        0 8px  28px rgba(0,0,0,.11),
        0 22px 52px rgba(0,0,0,.08);
      will-change: transform, opacity;
      transition: box-shadow .3s ease;
    }
    .collage-card:hover {
      box-shadow:
        0 4px  10px rgba(0,0,0,.10),
        0 18px 44px rgba(0,0,0,.17),
        0 36px 76px rgba(0,0,0,.13);
    }
    .collage-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      pointer-events: none; user-select: none;
      -webkit-user-drag: none;
      filter: brightness(.96) saturate(1.04);
      transition: filter .3s ease;
    }
    .collage-card:hover img {
      filter: brightness(1) saturate(1.08);
    }

    /* ── Top-left block ── */
    .landing__topleft {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      opacity: 0;
    }

    /* ── "Portfolio" — top-left, big, links to the portfolio ── */
    .landing__portfolio-link {
      z-index: 50;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(46px, 15vw, 80px);
      font-weight: 300;
      letter-spacing: 0.07em;
      line-height: 1;
      color: #fff;
      text-decoration: none;
    }
    .landing__portfolio-link:hover { opacity: .7; }

    /* ── CTA + bio — bottom-left ── */
    .landing__brand {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
      pointer-events: none;
      opacity: 0;
    }

    /* Mobile: show short variants, hide full */
    .landing__cta-label--short { display: inline; }
    .landing__cta-label--full { display: none; }
    .landing__bio--short { display: inline; }
    .landing__bio--full { display: none; }

    .landing__cta {
      display: inline-flex;
      align-items: center;
      gap: 18px;
      padding: 0;
      border-radius: 0;
      background: none;
      border: none;
      color: #fff;
      font-family: "Raleway", sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-decoration: none;
      overflow: hidden;
      transition: opacity .2s ease;
      pointer-events: auto;
      z-index: 50;
    }
    .landing__cta:hover { opacity: 0.7; }
    .landing__cta:active { transform: scale(0.98); }

    /* arrow track */
    .landing__cta-arrow-track {
      display: inline-flex;
      align-items: center;
      overflow: visible;
      width: 84px;
      flex-shrink: 0;
    }
    .landing__cta-arrow {
      flex-shrink: 0;
      transition: transform .38s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .landing__cta:hover .landing__cta-arrow { transform: translateX(6px); }
    /* click burst state — added by JS */
    .landing__cta.is-leaving,
    .landing__cta.is-leaving .landing__cta-arrow-track {
      overflow: visible;
    }
    .landing__cta.is-leaving .landing__cta-arrow {
      transform: translateX(180px);
      opacity: 0;
      transition: transform .38s cubic-bezier(0.4,0,1,1), opacity .28s ease .1s;
    }

    /* ── Bio ── */
    .landing__bio {
      max-width: none;
      font-family: "Raleway", sans-serif;
      font-size: 15px;
      font-weight: 300;
      font-style: normal;
      line-height: 1.8;
      letter-spacing: 0.01em;
      color: rgba(255,255,255,0.75);
      overflow-wrap: break-word;
    }

    /* Mobile collage */
    .collage-scene { transform: scale(.72); transform-origin: center; }

    /* ── Tablet (768px+) ── */
    @media (min-width: 768px) {
      .landing__topleft { top: 28px; left: 28px; }
      .landing__brand { left: 28px; bottom: auto; right: auto; top: 50%; transform: translateY(-50%); }
      .landing__portfolio-link { font-size: 150px; }
      .landing__cta-label--full { display: inline; }
      .landing__cta-label--short { display: none; }
      .landing__bio--full { display: inline; }
      .landing__bio--short { display: none; }
      .landing__bio { font-size: 22px; max-width: 560px; line-height: 1.5; }
      .landing__cta { font-size: 13px; padding: 0; margin-top: -60px; margin-left: 300px; }
      .collage-scene { transform: scale(1.4) translateX(-22%); transform-origin: center; }
    }

    /* ── Small desktop (1024px+) ── */
    @media (min-width: 1024px) {
      .landing__topleft { top: 36px; left: 44px; }
      .landing__brand { left: 44px; bottom: auto; top: 50%; transform: translateY(-50%); }
      .landing__portfolio-link { font-size: clamp(120px, 11vw, 180px); }
      .landing__bio { font-size: clamp(22px, 2vw, 32px); max-width: 580px; line-height: 1.4; }
      .landing__cta { font-size: 15px; padding: 0; margin-top: -60px; margin-left: 350px; }
      .collage-scene { transform: scale(.92); transform-origin: center; }
    }

    /* Keep tablet collage on portrait (e.g. iPad portrait at 1024px) */
    @media (min-width: 768px) and (orientation: portrait) {
      .collage-scene { transform: scale(1.4) translateX(-22%); transform-origin: center; }
    }

    /* ── Large desktop (1440px+) ── */
    @media (min-width: 1440px) {
      .landing__bio { font-size: clamp(26px, 2.2vw, 36px); max-width: 620px; }
      .landing__cta { font-size: 15px; padding: 0; }
      .collage-scene { transform: scale(1.2); }
    }

    /* ── XL desktop (1920px+) ── */
    @media (min-width: 1920px) {
      .landing__bio { font-size: clamp(28px, 2.4vw, 40px); max-width: 660px; }
      .landing__cta { font-size: 15px; padding: 0; }
      .collage-scene { transform: scale(1.45); }
    }

    /* ── Scribble decoration ── */
    .scribble-deco {
      position: absolute;
      left: calc(50% - 300px);
      top: 30%;
      transform: translateY(-50%);
      width: 600px;
      height: 660px;
      z-index: 0;
      pointer-events: none;
    }
    @media (min-width: 768px) {
      .scribble-deco {
        left: calc(50% - 20px);
        width: 540px;
        height: 610px;
      }
    }
    @media (min-width: 1024px) {
      .scribble-deco {
        left: calc(50% - 40px);
        width: 960px;
        height: 1060px;
      }
    }
    @media (min-width: 1440px) {
      .scribble-deco {
        left: calc(50% - 20px);
        width: 1100px;
        height: 1200px;
      }
    }
    .scribble-deco svg { width: 100%; height: 100%; }
    .scribble-path {
      stroke-dasharray: 8000;
      stroke-dashoffset: 8000;
      animation: scribble-draw 3.2s ease-out 1.2s forwards;
    }
    @keyframes scribble-draw {
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>

<body>
  <main class="landing">

    <!-- Decorative scribble (must be before collage-scene so it paints behind) -->
    <div class="scribble-deco" aria-hidden="true">
      <svg viewBox="-80 0 660 640" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="handDrawn" x="-8%" y="-8%" width="116%" height="116%">
            <feTurbulence id="scribble-turb" type="turbulence" baseFrequency="0.035" numOctaves="2" seed="1" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
          </filter>
        </defs>
        <path class="scribble-path"
          filter="url(#handDrawn)"
          d="M 260,40 C 360,10 500,60 520,160 C 540,260 460,340 360,330 C 260,320 180,260 190,170 C 200,80 310,50 390,90 C 470,130 500,240 470,320 C 440,400 340,440 240,420 C 140,400 80,330 100,250 C 120,170 220,150 300,190 C 380,230 410,330 380,410 C 350,490 250,530 150,510 C 50,490 0,420 20,350 C 40,280 130,260 200,300 C 270,340 290,430 260,500 C 230,570 140,600 60,580 C -20,560 -50,490 -20,440 C 10,390 80,390 120,430 C 160,470 160,550 120,580 C 80,610 20,600 -10,570 M 320,200 C 420,180 520,230 540,320 C 560,410 490,480 400,470 C 310,460 260,390 280,310 C 300,230 390,200 460,240 C 530,280 550,380 520,450 C 490,520 400,550 320,530 C 240,510 200,450 220,380"
          stroke="rgba(180,141,232,0.6)"
          stroke-width="1"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <!-- Cards injected here by collage.js -->
    <div class="collage-scene" id="collage-scene" aria-hidden="true"></div>

    <!-- Top-left block -->
    <div class="landing__topleft">
      <a class="landing__portfolio-link" href="./projects.html">PORTFOLIO</a>
    </div>

    <!-- Bottom-left: bio + CTA -->
    <div class="landing__brand">
      <p class="landing__bio">
        <span class="landing__bio--full"></span>
        <span class="landing__bio--short"></span>
      </p>
      <a class="landing__cta" href="./projects.html">
        <span class="landing__cta-label--full">Se arbeidene mine</span><span class="landing__cta-label--short">Arbeider</span>
        <span class="landing__cta-arrow-track" aria-hidden="true">
          <svg class="landing__cta-arrow" width="84" height="48" viewBox="0 -20 84 48" fill="none" style="overflow:visible">
            <defs>
              <filter id="arrowWobble" x="-20%" y="-60%" width="140%" height="220%">
                <feTurbulence id="arrow-turb" type="turbulence" baseFrequency="0.055" numOctaves="2" seed="2" result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
              </filter>
            </defs>
            <path d="M 30,4 C 32,-18 0,-20 0,4 C 0,26 30,24 30,4 L 76,4 M 70,-1 L 76,4 L 70,9"
              stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"
              filter="url(#arrowWobble)"/>
          </svg>
        </span>
      </a>
    </div>

  </main>

  <script src="./collage.js?v=1" defer></script>
  <script>
    (function () {
      var turb = document.getElementById('scribble-turb');
      var arrowTurb = document.getElementById('arrow-turb');
      var seed = 1;
      setInterval(function () {
        seed = (seed % 30) + 1;
        if (turb) turb.setAttribute('seed', seed);
        if (arrowTurb) arrowTurb.setAttribute('seed', seed);
      }, 120);
    })();
  </script>
</body>
</html>
