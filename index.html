<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DesignbyJosefine</title>
  <meta name="description" content="Portfolio — grafisk design, visuell identitet og typografi." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="./assets/me.webp" as="image">
  <link rel="preload" href="./assets/blaa.webp" as="image">
  <link rel="preload" href="./assets/brosyre-ute-srh.webp" as="image">
  <link rel="preload" href="./assets/norvald-iphone-orig.webp" as="image">
  <link rel="icon" href="assets/hvitlogo.webp">

  <style>
    @font-face {
      font-family: "Romie";
      src: url("./assets/Romie-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      height: 100%;
      font-family: "Poppins", system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      overflow: hidden;
    }

    /* ── Page shell ── */
    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 0.55s ease 0.08s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(20px, 3vh, 32px) clamp(24px, 4vw, 52px);
      flex-shrink: 0;
    }

    .logo {
      font-family: "Poppins", sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
    }
    .logo:hover { opacity: 0.6; }

    /* ── Main content ── */
    .main-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr clamp(300px, 32vw, 480px);
      gap: clamp(32px, 5vw, 96px);
      padding: 0 clamp(24px, 4vw, 52px);
      align-items: center;
      min-height: 0;
      overflow: visible;
    }

    /* ── Left column ── */
    .display-text {
      font-family: "Romie", Georgia, serif;
      font-size: clamp(42px, 5.4vw, 86px);
      font-weight: 400;
      line-height: 1.06;
      letter-spacing: -0.01em;
      margin: 0 0 clamp(32px, 4.5vh, 56px);
    }
    .display-text span { display: block; }

    .action-row {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.5vw, 36px);
    }

    .btn-primary {
      display: inline-block;
      padding: 14px 36px;
      border: 1.5px solid rgba(255,255,255,0.8);
      border-radius: 999px;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .btn-primary:hover {
      background: #fff;
      color: #0f0f0f;
      border-color: #fff;
      opacity: 1;
    }

    .btn-text {
      color: rgba(255,255,255,0.5);
      font-family: "Poppins", sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-text:hover { color: #fff; opacity: 1; }

    /* ── Right column: floating cards ── */
    .col-right {
      position: relative;
      height: clamp(380px, 54vh, 560px);
      overflow: visible;
    }

    .float-card {
      position: absolute;
      overflow: hidden;
      display: block;
      text-decoration: none;
      aspect-ratio: 3/4;
      box-shadow:
        0 6px 20px rgba(0,0,0,0.5),
        0 18px 52px rgba(0,0,0,0.45);
      will-change: transform;
    }

    .float-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(1);
      opacity: 0;
      transition: opacity 0.6s ease, filter 0.45s ease;
    }
    .float-card img.img--loaded { opacity: 1; }

    /* Floating keyframes — rotation baked in per card */
    @keyframes floatMe { 0%,100% { transform: rotate(-4deg)  translateY(0);     } 50% { transform: rotate(-4deg)  translateY(-13px); } }
    @keyframes float1  { 0%,100% { transform: rotate(8deg)   translateY(0);     } 50% { transform: rotate(8deg)   translateY(-16px); } }
    @keyframes float2  { 0%,100% { transform: rotate(14deg)  translateY(0);     } 50% { transform: rotate(14deg)  translateY(-10px); } }
    @keyframes float3  { 0%,100% { transform: rotate(-9deg)  translateY(0);     } 50% { transform: rotate(-9deg)  translateY(-15px); } }
    @keyframes float4  { 0%,100% { transform: rotate(5deg)   translateY(0);     } 50% { transform: rotate(5deg)   translateY(-18px); } }
    @keyframes float5  { 0%,100% { transform: rotate(-12deg) translateY(0);     } 50% { transform: rotate(-12deg) translateY(-11px); } }
    @keyframes float6  { 0%,100% { transform: rotate(7deg)   translateY(0);     } 50% { transform: rotate(7deg)   translateY(-14px); } }
    @keyframes float7  { 0%,100% { transform: rotate(-6deg)  translateY(0);     } 50% { transform: rotate(-6deg)  translateY(-12px); } }
    /* me.webp: front, to the left side */
    .float-card--me { width: 72%; left: -24%; top:  4%; z-index: 10; animation: floatMe 5.2s ease-in-out infinite; }
    /* project cards: two loose columns */
    .float-card--1  { width: 46%; left:  2%; top: -20%; z-index: 5;  animation: float1  4.7s ease-in-out infinite -1.3s; }
    .float-card--2  { width: 40%; left: 50%; top:  -8%; z-index: 4;  animation: float2  6.0s ease-in-out infinite -2.6s; }
    .float-card--3  { width: 48%; left: -14%; top: 40%; z-index: 3;  animation: float3  5.5s ease-in-out infinite -0.7s; }
    .float-card--4  { width: 40%; left: 38%; top:  44%; z-index: 2;  animation: float4  4.3s ease-in-out infinite -3.8s; }
    .float-card--5  { width: 44%; left: 12%; top:  68%; z-index: 1;  animation: float5  5.8s ease-in-out infinite -1.9s; }
    .float-card--6  { width: 42%; left: 52%; top:  58%; z-index: 2;  animation: float6  5.1s ease-in-out infinite -4.4s; }
    .float-card--7  { width: 44%; left: 64%; top:  18%; z-index: 3;  animation: float7  4.9s ease-in-out infinite -2.2s; }

    .float-card { cursor: pointer; }

    /* ── Bottom bar ── */
    .bottom-bar {
      padding: clamp(16px, 2.5vh, 26px) clamp(24px, 4vw, 52px);
      flex-shrink: 0;
      border-top: none;
    }

    .email-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin: 0 0 10px;
    }

    .email-form {
      display: flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      padding: 7px 7px 7px 16px;
      width: fit-content;
      gap: 10px;
    }

    .email-icon { flex-shrink: 0; opacity: 0.35; }

    .email-form input {
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 13px;
      width: 210px;
    }
    .email-form input::placeholder { color: rgba(255,255,255,0.26); }

    .email-submit {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      font-size: 15px;
      line-height: 1;
      transition: background 0.2s, color 0.2s;
    }
    .email-submit:hover { background: rgba(255,255,255,0.22); color: #fff; opacity: 1; }

    /* ── Mobile ── */
    @media (max-width: 820px) {
      html, body { overflow: auto; }
      .page { height: auto; min-height: 100vh; }
      .main-content {
        grid-template-columns: 1fr;
        padding-top: 24px;
        padding-bottom: 40px;
        align-items: flex-start;
        gap: 32px;
        overflow: visible;
      }
      .display-text { font-size: clamp(38px, 9vw, 58px); }
      .col-right {
        height: clamp(280px, 64vw, 400px);
        overflow: hidden;
      }
      /* reset all cards to non-negative tops on mobile */
      .float-card--me { width: 44%; left: 16%; top: 4%;  }
      .float-card--1  { width: 36%; left: 6%;  top: 4%;  }
      .float-card--2  { width: 34%; left: 58%; top: 2%;  }
      .float-card--3  { width: 38%; left: 8%;  top: 46%; }
      .float-card--4  { width: 34%; left: 52%; top: 48%; }
      .float-card--5,
      .float-card--6,
      .float-card--7  { display: none; }
    }

    @media (max-height: 680px) and (min-width: 821px) {
      .display-text { font-size: clamp(32px, 4.2vw, 62px); margin-bottom: 28px; }
      .col-right { height: clamp(260px, 38vh, 380px); }
    }

    @media (min-width: 2400px) {
      .main-content { max-width: 2400px; margin-left: auto; margin-right: auto; }
      .top-bar, .bottom-bar { max-width: 2400px; margin-left: auto; margin-right: auto; }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="top-bar">
      <a class="logo" href="./index.html">Josefine Gjertsen</a>
    </header>

    <div class="main-content">

      <!-- Left -->
      <div class="col-left">
        <h1 class="display-text">
          <span>Visuell identitet</span>
          <span>Redaksjonelt design</span>
          <span>Digitale opplevelser</span>
        </h1>
        <div class="action-row">
          <a class="btn-primary" href="./projects.html">Prosjekter</a>
          <a class="btn-text" href="./projects.html#about">Om meg</a>
        </div>
      </div>

      <!-- Right: floating photo cards -->
      <div class="col-right">
        <!-- me.webp: in front, to the left side -->
        <a class="float-card float-card--me" href="./projects.html#about">
          <img src="./assets/me.webp" alt="Josefine Gjertsen" loading="eager" decoding="async">
        </a>
        <a class="float-card float-card--1" href="./tidsskrift.html">
          <img src="./assets/blaa.webp" alt="Tidsskrift" loading="eager" decoding="async">
        </a>
        <a class="float-card float-card--2" href="./flerkanalspublisering.html">
          <img src="./assets/brosyre-ute-srh.webp" alt="Flerkanalspublisering" loading="eager" decoding="async">
        </a>
        <a class="float-card float-card--3" href="./ansatts-portal.html">
          <img src="./assets/norvald-iphone-orig.webp" alt="Tjønnås og Norvald" loading="eager" decoding="async">
        </a>
        <a class="float-card float-card--4" href="./bokomslag.html">
          <img src="./assets/baby-tote.webp" alt="Bokomslag" loading="eager" decoding="async">
        </a>
        <a class="float-card float-card--5" href="./we-visuell-profil.html">
          <img src="./assets/we-banner.webp" alt="WE Visuell profil" loading="eager" decoding="async">
        </a>
        <a class="float-card float-card--6" href="./emanuel-viegeland.html">
          <img src="./assets/viegeland.webp" alt="Emanuel Viegeland nettside" loading="eager" decoding="async">
        </a>
        <a class="float-card float-card--7" href="./reina-fruktgard.html">
          <img src="./assets/reinalys.webp" alt="Reina Fruktgård" loading="eager" decoding="async">
        </a>
      </div>

    </div>

    <!-- Bottom: email -->
    <div class="bottom-bar">
      <p class="email-label">Hold deg oppdatert</p>
      <div class="email-form">
        <svg class="email-icon" width="14" height="11" viewBox="0 0 14 11" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="13" height="10" rx="1" stroke="currentColor"/>
          <path d="M1 1l6 4.5L13 1" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="email" placeholder="Din e-post" aria-label="E-postadresse">
        <a href="mailto:josefinegjertsen@gmail.com" class="email-submit" aria-label="Send">&#8594;</a>
      </div>
    </div>

  </div>

<script>
  document.querySelectorAll('.float-card img').forEach(function(img) {
    var done = function() { img.classList.add('img--loaded'); };
    if (img.complete) done(); else img.addEventListener('load', done);
  });

  if (window.matchMedia('(hover: hover)').matches) {
    var TRANS = 'transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.65s ease, filter 0.45s ease';
    var SHADOW_HOVER = '0 14px 40px rgba(0,0,0,0.55), 0 32px 80px rgba(0,0,0,0.6)';
    var SHADOW_BASE  = '0 6px 20px rgba(0,0,0,0.5), 0 18px 52px rgba(0,0,0,0.45)';

    document.querySelectorAll('.float-card').forEach(function(card) {
      var img = card.querySelector('img');

      card.addEventListener('mouseenter', function() {
        // Freeze card at its current animated position
        var live = getComputedStyle(card).transform;
        card.style.animation = 'none';
        card.style.transition = 'none';
        card.style.transform = live;
        card.offsetHeight; // force reflow so browser commits the frozen frame
        // Now transition to hover position
        card.style.transition = TRANS;
        card.style.transform = 'rotate(0deg) translateY(-18px) scale(1.05)';
        card.style.boxShadow = SHADOW_HOVER;
        card.style.zIndex = '20';
        if (img) img.style.filter = 'brightness(0.75)';
      });

      card.addEventListener('mouseleave', function() {
        // Let the floating animation take back over immediately
        card.style.transition = '';
        card.style.transform = '';
        card.style.animation = '';
        card.style.boxShadow = '';
        card.style.zIndex = '';
        if (img) img.style.filter = '';
      });
    });
  }
</script>
</body>
</html>
