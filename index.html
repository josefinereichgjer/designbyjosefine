<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Josefine R.G — Grafisk designer (portefølje)</title>

  <link rel="preload" href="./assets/reinalys.webp"             as="image">
  <link rel="preload" href="./assets/blaa.webp"                 as="image">
  <link rel="preload" href="./assets/krit1.webp"                as="image">
  <link rel="preload" href="./assets/herotjonn.webp"            as="image">
  <link rel="preload" href="./assets/norvald/homepage-em.webp"  as="image">
  <link rel="preload" href="./assets/laptop-mockup.webp"        as="image">

  <link rel="stylesheet" href="https://use.typekit.net/bfd6wfh.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

  <style>
    @font-face {
      font-family: "SelfModern";
      src: url("./assets/selfmodern.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0f0f0f;
      font-family: "Avenir Next", "Avenir", "Century Gothic", sans-serif;
    }

    /* ── Full-screen intro ── */
    #intro {
      position: fixed; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(28px, 5vh, 52px);
    }

    /* ── Tagline ── */
    #tagline {
      font-family: 'Poppins', sans-serif;
      color: #fff;
      font-size: clamp(13px, 1.4vw, 18px);
      font-weight: 400;
      letter-spacing: 0.04em;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      text-align: center;
    }

    /* ── Card stack ── */
    #card-stage {
      position: relative;
      width: clamp(150px, 20vw, 260px);
      aspect-ratio: 3 / 4;
    }

    .sc {
      position: absolute; inset: 0;
      transform: translateX(var(--tx, 0px)) translateY(var(--ty, 0px)) rotate(var(--r, 0deg));
      overflow: hidden;
      box-shadow:
        0 4px 16px rgba(0,0,0,0.6),
        0 20px 60px rgba(0,0,0,0.55);
      will-change: transform, opacity;
    }

    .sc img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* ── Skip button ── */
    #skip {
      position: fixed;
      bottom: 28px; right: 32px;
      background: none;
      border: 1px solid rgba(255,255,255,0.35);
      color: rgba(255,255,255,0.70);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 8px 16px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    #skip:hover { border-color: rgba(255,255,255,0.7); color: rgba(255,255,255,0.95); }
  </style>
</head>
<body>

  <div id="intro">
    <p id="tagline">Bachelor er nå ferdig — åpen for jobb!</p>
    <div id="card-stage">
      <div class="sc" style="--r: -14deg; --tx: -16px; --ty:  6px"><img src="./assets/reinalys.webp"             alt=""></div>
      <div class="sc" style="--r:  10deg; --tx:  18px; --ty: -8px"><img src="./assets/blaa.webp"                 alt=""></div>
      <div class="sc" style="--r:  -5deg; --tx:  -9px; --ty:  4px"><img src="./assets/krit1.webp"                alt=""></div>
      <div class="sc" style="--r:  16deg; --tx:  15px; --ty: -5px"><img src="./assets/herotjonn.webp"            alt=""></div>
      <div class="sc" style="--r:  -9deg; --tx: -12px; --ty:  3px"><img src="./assets/norvald/homepage-em.webp"  alt=""></div>
      <div class="sc" style="--r:   4deg; --tx:   6px; --ty: -2px"><img src="./assets/laptop-mockup.webp"        alt=""></div>
    </div>
  </div>

  <button id="skip">Hopp over</button>

  <script>
    var DEST = './projects.html';

    function go() { window.location.replace(DEST); }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      go();
    } else {
      var tl = gsap.timeline({ onComplete: go });

      /* Cards drop in one by one */
      tl.from('.sc', {
        y: -520,
        opacity: 0.2,
        duration: 0.6,
        stagger: 0.24,
        ease: 'power3.out'
      });

      /* Tagline fades in as last card settles */
      tl.to('#tagline', { opacity: 1, visibility: 'visible', duration: 0.6, ease: 'power2.out' }, '-=0.2');

      /* Pause */
      tl.to({}, { duration: 1.1 });

      /* Stack scales up + fades, then redirect fires via onComplete */
      tl.to('#card-stage', { scale: 1.07, duration: 0.55, ease: 'power2.in' }, '<');
      tl.to('#intro',      { opacity: 0,  duration: 0.6,  ease: 'power2.in' }, '-=0.25');

      document.getElementById('skip').addEventListener('click', function () {
        tl.progress(1);
      });
    }
  </script>
</body>
</html>
