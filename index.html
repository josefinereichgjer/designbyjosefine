<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DesignbyJosefine</title>
  <meta name="description" content="Portfolio — grafisk design, visuell identitet og typografi." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="preload" href="./assets/reinalys.webp" as="image">
  <link rel="icon" href="assets/hvitlogo.webp">

  <style>
    @font-face {
      font-family: "Romie";
      src: url("./assets/Romie-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      height: 100%;
      font-family: "Poppins", system-ui, sans-serif;
      background: #0f0f0f;
      color: #fff;
      overflow: hidden;
    }

    /* ── Page shell ── */
    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 0.55s ease 0.08s forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    /* ── Top bar ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: clamp(20px, 3vh, 32px) clamp(24px, 4vw, 52px);
      flex-shrink: 0;
    }

    .logo {
      font-family: "Poppins", sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
    }
    .logo:hover { opacity: 0.6; }

    /* ── Main content ── */
    .main-content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr clamp(320px, 30vw, 460px);
      gap: clamp(32px, 5vw, 96px);
      padding: 0 clamp(24px, 4vw, 52px);
      align-items: center;
      min-height: 0;
    }

    /* ── Left column ── */
    .display-text {
      font-family: "Romie", Georgia, serif;
      font-size: clamp(42px, 5.4vw, 86px);
      font-weight: 400;
      line-height: 1.06;
      letter-spacing: -0.01em;
      margin: 0 0 clamp(32px, 4.5vh, 56px);
    }
    .display-text span { display: block; }

    .action-row {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.5vw, 36px);
    }

    .btn-primary {
      display: inline-block;
      padding: 11px 28px;
      border: 1.5px solid rgba(255,255,255,0.8);
      border-radius: 999px;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .btn-primary:hover {
      background: #fff;
      color: #0f0f0f;
      border-color: #fff;
      opacity: 1;
    }

    .btn-text {
      color: rgba(255,255,255,0.5);
      font-family: "Poppins", sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: color 0.2s;
    }
    .btn-text:hover { color: #fff; opacity: 1; }

    /* ── Right column: project cards ── */
    .col-right {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .proj-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.04);
      text-decoration: none;
      color: #fff;
      transition: background 0.22s;
    }
    .proj-item:first-child { background: rgba(255,255,255,0.09); }
    .proj-item:hover { background: rgba(255,255,255,0.13); opacity: 1; }

    .proj-item__thumb {
      width: 84px;
      height: 68px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .proj-item__thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      filter: brightness(0.9);
    }

    .proj-item__info { flex: 1; min-width: 0; }

    .proj-item__label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 7px;
    }

    .proj-item__name {
      font-family: "Poppins", sans-serif;
      font-size: clamp(13px, 1.1vw, 15px);
      font-weight: 400;
      line-height: 1.3;
      margin: 0;
    }

    /* ── Bottom bar ── */
    .bottom-bar {
      padding: clamp(16px, 2.5vh, 26px) clamp(24px, 4vw, 52px);
      flex-shrink: 0;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .email-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin: 0 0 10px;
    }

    .email-form {
      display: flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 999px;
      padding: 7px 7px 7px 16px;
      width: fit-content;
      gap: 10px;
    }

    .email-icon { flex-shrink: 0; opacity: 0.35; }

    .email-form input {
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-family: "Poppins", sans-serif;
      font-size: 13px;
      width: 210px;
    }
    .email-form input::placeholder { color: rgba(255,255,255,0.26); }

    .email-submit {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      font-size: 15px;
      line-height: 1;
      transition: background 0.2s, color 0.2s;
    }
    .email-submit:hover { background: rgba(255,255,255,0.22); color: #fff; opacity: 1; }

    /* ── Hamburger ── */
    .nav-toggle {
      position: fixed;
      top: 20px; right: 22px;
      z-index: 450;
      background: none; border: none;
      cursor: pointer; padding: 8px;
      display: flex; flex-direction: column;
      gap: 5px; align-items: flex-end;
    }
    .nav-toggle__bar {
      display: block; height: 1px;
      background: #fff;
      transition: transform 0.32s ease, opacity 0.2s ease, width 0.32s ease;
    }
    .nav-toggle__bar:nth-child(1) { width: 22px; }
    .nav-toggle__bar:nth-child(2) { width: 14px; }
    .nav-toggle__bar:nth-child(3) { width: 22px; }
    .nav-toggle.is-open .nav-toggle__bar:nth-child(1) { transform: translateY(6px) rotate(45deg); width: 22px; }
    .nav-toggle.is-open .nav-toggle__bar:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-toggle.is-open .nav-toggle__bar:nth-child(3) { transform: translateY(-6px) rotate(-45deg); width: 22px; }

    /* ── Nav overlay ── */
    .nav-menu {
      position: fixed; inset: 0; z-index: 400;
      background: #0f0f0f;
      display: flex; align-items: center;
      padding: 0 clamp(28px, 8vw, 100px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.38s ease;
    }
    .nav-menu.is-open { opacity: 1; pointer-events: auto; }
    .nav-menu__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: clamp(8px, 2.5vh, 20px); }
    .nav-menu__link {
      font-family: "Romie", Georgia, serif;
      font-size: clamp(42px, 10vw, 130px);
      font-weight: 400; color: #fff;
      text-decoration: none;
      letter-spacing: 0.03em; line-height: 1.05;
      display: block; transition: opacity 0.2s;
    }
    .nav-menu__link:hover { opacity: 0.38; }

    /* ── Mobile ── */
    @media (max-width: 820px) {
      html, body { overflow: auto; }
      .page { height: auto; min-height: 100vh; }
      .main-content {
        grid-template-columns: 1fr;
        padding-top: 24px;
        padding-bottom: 32px;
        align-items: flex-start;
        gap: 36px;
      }
      .display-text { font-size: clamp(38px, 9vw, 58px); }
      .col-right { max-width: 100%; }
    }

    @media (max-height: 680px) and (min-width: 821px) {
      .display-text { font-size: clamp(32px, 4.2vw, 62px); }
      .display-text { margin-bottom: 28px; }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="top-bar">
      <a class="logo" href="./index.html">Josefine Gjertsen</a>
    </header>

    <div class="main-content">

      <!-- Left -->
      <div class="col-left">
        <h1 class="display-text">
          <span>Visuell identitet</span>
          <span>Redaksjonelt design</span>
          <span>Digitale opplevelser</span>
        </h1>
        <div class="action-row">
          <a class="btn-primary" href="./projects.html">Prosjekter</a>
          <a class="btn-text" href="./projects.html#about">Om meg</a>
        </div>
      </div>

      <!-- Right: project cards -->
      <div class="col-right">

        <a class="proj-item" href="./reina-fruktgard.html">
          <div class="proj-item__thumb">
            <img src="./assets/reinalys.webp" alt="Reina Fruktgård" loading="eager" decoding="async">
          </div>
          <div class="proj-item__info">
            <span class="proj-item__label">
              Prosjekt
              <svg width="16" height="10" viewBox="0 0 16 10" fill="none" aria-hidden="true">
                <line x1="0" y1="5" x2="13" y2="5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                <path d="M10 2L14 5L10 8" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <p class="proj-item__name">Reina Fruktgård</p>
          </div>
        </a>

        <a class="proj-item" href="./we-visuell-profil.html">
          <div class="proj-item__thumb">
            <img src="./assets/lillawenettside.webp" alt="WE Visuell profil" loading="lazy" decoding="async">
          </div>
          <div class="proj-item__info">
            <span class="proj-item__label">
              Prosjekt
              <svg width="16" height="10" viewBox="0 0 16 10" fill="none" aria-hidden="true">
                <line x1="0" y1="5" x2="13" y2="5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                <path d="M10 2L14 5L10 8" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <p class="proj-item__name">WE Visuell profil</p>
          </div>
        </a>

        <a class="proj-item" href="./tidsskrift.html">
          <div class="proj-item__thumb">
            <img src="./assets/krit.webp" alt="Tidsskrift" loading="lazy" decoding="async">
          </div>
          <div class="proj-item__info">
            <span class="proj-item__label">
              Prosjekt
              <svg width="16" height="10" viewBox="0 0 16 10" fill="none" aria-hidden="true">
                <line x1="0" y1="5" x2="13" y2="5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                <path d="M10 2L14 5L10 8" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <p class="proj-item__name">Tidsskrift</p>
          </div>
        </a>

      </div>
    </div>

    <!-- Bottom: email -->
    <div class="bottom-bar">
      <p class="email-label">Hold deg oppdatert</p>
      <div class="email-form">
        <svg class="email-icon" width="14" height="11" viewBox="0 0 14 11" fill="none" aria-hidden="true">
          <rect x="0.5" y="0.5" width="13" height="10" rx="1" stroke="currentColor"/>
          <path d="M1 1l6 4.5L13 1" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="email" placeholder="Din e-post" aria-label="E-postadresse">
        <a href="mailto:josefinegjertsen@gmail.com" class="email-submit" aria-label="Send">&#8594;</a>
      </div>
    </div>

  </div>

  <button class="nav-toggle" aria-label="Åpne meny" aria-expanded="false" aria-controls="nav-menu">
    <span class="nav-toggle__bar"></span>
    <span class="nav-toggle__bar"></span>
    <span class="nav-toggle__bar"></span>
  </button>

  <nav class="nav-menu" id="nav-menu" aria-hidden="true">
    <ul class="nav-menu__list">
      <li><a class="nav-menu__link" href="./projects.html">Arbeider</a></li>
      <li><a class="nav-menu__link" href="./projects.html#about">Om</a></li>
      <li><a class="nav-menu__link" href="mailto:josefinegjertsen@gmail.com">Kontakt</a></li>
    </ul>
  </nav>

  <script>
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var menu   = document.querySelector('.nav-menu');
      if (!toggle || !menu) return;
      function open()  { menu.classList.add('is-open'); toggle.classList.add('is-open'); toggle.setAttribute('aria-expanded','true'); menu.setAttribute('aria-hidden','false'); toggle.setAttribute('aria-label','Lukk meny'); }
      function close() { menu.classList.remove('is-open'); toggle.classList.remove('is-open'); toggle.setAttribute('aria-expanded','false'); menu.setAttribute('aria-hidden','true'); toggle.setAttribute('aria-label','Åpne meny'); }
      toggle.addEventListener('click', function() { menu.classList.contains('is-open') ? close() : open(); });
      menu.querySelectorAll('.nav-menu__link').forEach(function(l) { l.addEventListener('click', close); });
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape') close(); });
    })();
  </script>
</body>
</html>
