<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="format-detection" content="telephone=no">
  <title>Personlige prosjekter — DesignbyJosefine</title>
  <meta name="description" content="Personlige prosjekter — DesignbyJosefine" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Caveat:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=32" />
  <style>
    body { background: #faf8f5; color: #1a1a1a; }
    .content { background: #faf8f5; }
    .card { background: #fff; }
    .card__img-wrap { background: #f0ede8; }
    .card__caption { background: #fff; }
    .card__title { color: #1a1a1a; }
    .card__tags { color: #666; }

    /* ── Top navbar ── */
    .sidebar {
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1920px;
      height: 76px;
      padding: 0 clamp(20px, 3vw, 48px);
      display: flex;
      align-items: center;
    }
    .sidebar__inner {
      flex-direction: row;
      align-items: center;
      width: 100%;
      height: 100%;
      gap: 0;
    }
    .nav {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: clamp(16px, 2vw, 32px);
      margin-top: 0;
      flex: 1;
      justify-content: flex-end;
    }
    .nav__link { padding: 0; font-size: 11px; }
    .content {
      margin-left: 0;
      margin-right: 0;
      max-width: none;
      padding-top: 108px;
    }
    #work { padding-top: 40px; padding-bottom: 120px; }
    @media (max-width: 820px) {
      .content { padding-top: 96px; }
      #work { padding-bottom: 80px; }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#content">Hopp til innhold</a>

  <header class="sidebar" id="sidebar">
    <div class="sidebar__inner">
      <a class="back-btn" href="./projects.html" aria-label="Tilbake til arbeider"><svg width="9" height="16" viewBox="0 0 9 16" fill="none" aria-hidden="true"><path d="M8 1L1 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>

      <nav class="nav" aria-label="Primary">
        <a class="nav__link" href="./index.html"><span>Hjem</span></a>
        <a class="nav__link" href="./projects.html"><span>Arbeider</span></a>
        <a class="nav__link" href="./projects.html#about"><span>Om</span></a>
        <a class="nav__link" href="./projects.html#contact"><span>Kontakt</span></a>
      </nav>

      <button class="sidebar__toggle" id="sidebarToggle" aria-expanded="false" aria-controls="sidebar" aria-label="Meny">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
    </div>
  </header>

  <main id="content" class="content">
    <section class="section" id="work">
      <div class="masonry" id="grid" aria-live="polite"></div>
    </section>
  </main>

  <script src="./projects.js?v=6" defer></script>
  <script>
    const yearEl = document.getElementById("year");
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    document.getElementById("sidebarToggle")?.addEventListener("click", () => {
      const sidebar = document.getElementById("sidebar");
      const isOpen = sidebar.classList.toggle("sidebar--open");
      document.getElementById("sidebarToggle").setAttribute("aria-expanded", String(isOpen));
    });

    document.addEventListener('DOMContentLoaded', function () {
      const personalProjects = (window.PROJECTS || []).filter(p => p.personal);
      const grid = document.getElementById("grid");
      if (grid) {
        grid.innerHTML = personalProjects.map(p => `
          <a class="card card--visible" href="./${p.id}.html">
            <div class="card__img-wrap">
              <img class="card__img" src="${p.cover}" alt="${p.title}" loading="lazy" decoding="async"${p.coverPosition ? ` style="object-position:${p.coverPosition}"` : ""}>
            </div>
            <div class="card__caption">
              <p class="card__title">${p.title}</p>
              <p class="card__tags">${p.subtitle || ""}</p>
            </div>
          </a>
        `).join("");
      }
    });
  </script>
</body>
</html>
