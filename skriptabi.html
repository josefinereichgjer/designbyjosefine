<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="format-detection" content="telephone=no">
  <title>Skriptabi — DesignbyJosefine</title>
  <meta name="description" content="Skriptabi — DesignbyJosefine" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20" />
  <link rel="icon" href="assets/hvitlogo.png">
</head>

<body>
  <a class="skip-link" href="#content">Hopp til innhold</a>

  <header class="sidebar sidebar--detail" id="sidebar">
    <div class="sidebar__inner">
      <div class="brand">
        <a class="brand__mark" href="./projects.html" aria-label="Back to work">
          <img src="./assets/hvitlogo.webp" alt="Logo" class="brand__logo">
        </a>
      </div>
      <a class="back-btn" href="./projects.html" aria-label="Tilbake til arbeider"><svg width="9" height="16" viewBox="0 0 9 16" fill="none" aria-hidden="true"><path d="M8 1L1 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <nav class="nav" aria-label="Main navigation">
        <a class="nav__link" href="./projects.html"><span>Arbeider</span></a>
        <a class="nav__link" href="./projects.html#about"><span>Om</span></a>
        <a class="nav__link" href="./projects.html#contact"><span>Kontakt</span></a>
      </nav>
      <footer class="meta">
        <p class="meta__small">© <span id="year"></span> Josefine Gjertsen</p>
      </footer>
      <button class="sidebar__toggle" id="sidebarToggle" aria-expanded="false" aria-controls="sidebar">Meny</button>
    </div>
  </header>

  <main id="content" class="content">
    <article class="project" id="project">
      <div class="project__gallery">
        <figure class="project__figure project__figure--wide">
          <img loading="lazy" decoding="async" src="./assets/lovechildbabi.webp" alt="Skriptabi">
        </figure>
        <figure class="project__figure project__figure--wide">
          <img loading="lazy" decoding="async" src="./assets/babylogo@3x.webp" alt="Weit & Weiter logo">
        </figure>
      </div>

      <div class="related"><h2 class="related__heading">Mer å se på</h2><div class="related__grid">
        <a class="related__card" href="./reina-fruktgard.html">
          <img src="./assets/reinalys.webp" alt="Reina Fruktgård" loading="lazy">
          <p class="related__title">Reina Fruktgård</p>
        </a>
        <a class="related__card" href="./stoppestedet.html">
          <img src="./stopp/assets/utenforforside.webp" alt="Stoppestedet" loading="lazy">
          <p class="related__title">Stoppestedet</p>
        </a>
        <a class="related__card" href="./ansatts-portal.html">
          <img src="./assets/tjonnipadiphone.webp" alt="Tjønnås og Norvald" loading="lazy">
          <p class="related__title">Tjønnås og Norvald</p>
        </a>
      </div></div>
    </article>
  </main>

  <script>
    document.querySelector("#year").textContent = new Date().getFullYear();
    const toggle = document.querySelector("#sidebarToggle");
    toggle?.addEventListener("click", () => {
      const sidebar = document.querySelector("#sidebar");
      const isOpen = sidebar.classList.toggle("sidebar--open");
      toggle.setAttribute("aria-expanded", String(isOpen));
    });
  </script>
</body>
</html>
