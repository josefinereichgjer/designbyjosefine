<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="format-detection" content="telephone=no">
  <title>Emanuel Viegeland nettside — DesignbyJosefine</title>
  <meta name="description" content="Emanuel Viegeland nettside — DesignbyJosefine" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=32" />
  <link rel="icon" href="assets/hvitlogo.webp">
  <style>
    .ev-img-full { width: 100%; height: auto; display: block; }
    .ev-img-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
    .ev-img-pair img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @media (max-width: 640px) { .ev-img-pair { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <header class="proj-header" id="projHeader">
    <div class="proj-header__inner">
      <a class="proj-header__logo" href="./index.html">JOSEFINE R.G</a>
      <nav class="proj-header__nav" id="projNav">
        <a class="proj-header__link proj-header__link--active" href="./projects.html">Arbeider</a>
        <a class="proj-header__link" href="./projects.html#about">Om meg</a>
        <a class="proj-header__link" href="./projects.html#contact">Kontakt</a>
      </nav>
      <button class="proj-header__toggle" id="projToggle" aria-label="Meny" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="proj-main">

    <div class="proj-breadcrumb">
      <a href="./projects.html">Arbeider</a>
      <span class="proj-breadcrumb__sep">›</span>
      <strong style="color:#0d0d0d; font-weight:700; letter-spacing:0.12em;">Emanuel Viegeland</strong>
    </div>

    <section class="proj-hero">
      <div class="proj-hero__left">
        <h1 class="proj-hero__title">Emanuel<br>Viegeland</h1>
        <p class="proj-hero__sub">Redesign / UX</p>
      </div>
      <div class="proj-hero__right">
        <img class="proj-hero__img" src="./assets/3skjermer.png" alt="Emanuel Viegeland nettside — tre skjermer" fetchpriority="high">
      </div>
    </section>

    <div class="proj-meta-row">
      <div class="proj-meta-fields">
        <div>
          <span class="proj-meta-label">Fagfelt</span>
          <span class="proj-meta-value">Redesign / UX</span>
        </div>
        <div>
          <span class="proj-meta-label">Type</span>
          <span class="proj-meta-value">Nettside</span>
        </div>
        <div>
          <span class="proj-meta-label">År</span>
          <span class="proj-meta-value">2026</span>
        </div>
      </div>
    </div>

    <article>

      <div class="proj-sections">

        <div class="proj-section proj-section--none">
          <div class="ev-img-pair">
            <img src="./assets/em.png" alt="Emanuel Viegeland" loading="lazy">
            <img src="./assets/laptop.png" alt="Emanuel Viegeland nettside på laptop" loading="lazy">
          </div>
        </div>

        <div class="proj-section proj-section--none">
          <img class="ev-img-full" src="./assets/3skjermer.png" alt="Emanuel Viegeland nettside — responsivt design" loading="lazy">
        </div>

      </div>

    </article>

    <div class="proj-adjacent">
      <a class="proj-adjacent__link" href="./reina-fruktgard.html">← Gå til Reina Fruktgård</a>
      <a class="proj-adjacent__link" href="./tidsskrift.html">Gå til Tidsskrift →</a>
    </div>

  </main>

  <script src="./projects.js?v=6"></script>
  <script>
    var header = document.getElementById('projHeader');
    var toggle = document.getElementById('projToggle');
    toggle.addEventListener('click', function() {
      var open = header.classList.toggle('proj-header--open');
      toggle.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', function(e) {
      if (!header.contains(e.target)) {
        header.classList.remove('proj-header--open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
