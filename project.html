<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="format-detection" content="telephone=no">
  <title>Arbeid — DesignbyJosefine</title>
  <meta name="description" content="Arbeidsdetaljer" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500&family=Caveat:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=31" />
  <link rel="icon" href="assets/hvitlogo.webp">
</head>

<body>
  <div class="lb-overlay" id="lbOverlay" role="dialog" aria-modal="true" aria-label="Forstørret bilde">
    <button class="lb-close" id="lbClose" aria-label="Lukk">✕</button>
    <button class="lb-prev" id="lbPrev" aria-label="Forrige">&#8592;</button>
    <img id="lbImg" src="" alt="">
    <button class="lb-next" id="lbNext" aria-label="Neste">&#8594;</button>
  </div>

  <header class="sidebar sidebar--detail" id="sidebar">
    <div class="sidebar__inner">
      <a class="back-btn" href="./projects.html" aria-label="Tilbake til arbeider"><svg width="9" height="16" viewBox="0 0 9 16" fill="none" aria-hidden="true"><path d="M8 1L1 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>

      <nav class="nav" aria-label="Main navigation">
        <a class="nav__link" href="./projects.html"><span>Arbeider</span></a>
        <a class="nav__link" href="./projects.html#about"><span>Om</span></a>
        <a class="nav__link" href="./projects.html#contact"><span>Kontakt</span></a>
      </nav>

      <footer class="meta">
        <p class="meta__small">© <span id="year"></span> Josefine Gjertsen</p>
      </footer>

      <button class="sidebar__toggle" id="sidebarToggle" aria-expanded="false" aria-controls="sidebar">
        Meny
      </button>
    </div>
  </header>

  <main id="content" class="content">
    <article class="project" id="project"></article>
  </main>

  <script src="./projects.js?v=6"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const params = new URLSearchParams(location.search);
    const id = params.get("id");
    const viewProcess = params.get("view") === "process";

    const project = (window.PROJECTS || []).find(p => p.id === id);
    const yearEl = document.querySelector("#year");
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    if (!project) {
      $("#project").innerHTML = `<p>Arbeid ikke funnet. <a href="./projects.html">Gå tilbake</a>.</p>`;
    } else {

      // ── Section content renderer (used in process view) ──────────────
      function renderSectionInner(s) {
        const bodyHTML = s.body ? s.body.split("\n\n").map(p => `<p class="bg__body">${p}</p>`).join("") : "";
        let inner = s.twoCols ? `<div class="bg__body-cols">${bodyHTML}</div>` : bodyHTML;
        if (s.image)  inner += `<img class="bg__img" src="${s.image}" alt="${s.heading}" loading="lazy" decoding="async">`;
        if (s.body2)  inner += s.body2.split("\n\n").map(p => `<p class="bg__body">${p}</p>`).join("");
        if (s.image2) inner += `<img class="bg__img" src="${s.image2}" alt="${s.heading}" loading="lazy" decoding="async">`;
        if (s.body3)  inner += s.body3.split("\n\n").map(p => `<p class="bg__body">${p}</p>`).join("");
        if (s.images) inner += `<div class="bg__img-row">${s.images.map(src => `<img class="bg__img bg__img--small" src="${src}" alt="${s.heading}" loading="lazy" decoding="async">`).join("")}</div>`;
        if (s.imageSmall)  inner += `<img class="bg__img bg__img--sm" src="${s.imageSmall}" alt="${s.heading}" loading="lazy" decoding="async">`;
        if (s.imageStack)  inner += `<div class="bg__img-stack">${s.imageStack.map(src => `<img class="bg__img bg__img--stacked" src="${src}" alt="${s.heading}" loading="lazy" decoding="async">`).join("")}</div>`;
        if (s.imagePairs)  inner += `<div class="bg__img-pairs">${s.imagePairs.map(([l, r]) => `<div class="bg__img-pair"><img class="bg__img" src="${l}" loading="lazy" decoding="async"><img class="bg__img" src="${r}" loading="lazy" decoding="async"></div>`).join("")}</div>`;
        if (s.palette) {
          const isCards = s.palette.some(c => c.description);
          if (isCards) {
            inner += `<div class="palette palette--cards">${s.palette.map(c => `
              <div class="palette__item">
                <div class="palette__swatch" style="background:${c.hex}"></div>
                <div class="palette__info">
                  <span class="palette__name">${c.name}</span>
                  <span class="palette__hex">${c.hex}</span>
                  <span class="palette__desc">${c.description}</span>
                </div>
              </div>`).join("")}</div>`;
          } else {
            inner += `<div class="palette">${s.palette.map(c => `
              <div class="palette__item">
                <div class="palette__swatch" style="background:${c.hex}"></div>
                <div class="palette__info">
                  <span class="palette__hex">${c.hex}</span>
                  <span class="palette__name">${c.name}</span>
                  <span class="palette__val">RGB&nbsp;&nbsp;${c.rgb}</span>
                  <span class="palette__val">CMYK&nbsp;${c.cmyk}</span>
                  <span class="palette__val">${c.pantone}</span>
                </div>
              </div>`).join("")}</div>`;
          }
        }
        if (s.links) {
          s.links.forEach(lnk => {
            inner += lnk.plain
              ? `<a class="accordion__link" href="${lnk.src}" target="_blank" rel="noopener">↗&#xFE0E; ${lnk.label}</a>`
              : `<a class="btn-pdf btn-pdf--green" href="${lnk.src}" target="_blank" rel="noopener" style="margin-top:12px;display:inline-block">↗&#xFE0E; ${lnk.label}</a>`;
          });
        }
        if (s.link) {
          inner += s.link.plain
            ? `<a class="accordion__link" href="${s.link.src}" target="_blank" rel="noopener">↗&#xFE0E; ${s.link.label}</a>`
            : `<a class="btn-pdf btn-pdf--green" href="${s.link.src}" target="_blank" rel="noopener" style="margin-top:18px;display:inline-block">↗&#xFE0E; ${s.link.label}</a>`;
        }
        return inner;
      }

      // ── Gallery figure renderer ───────────────────────────────────────
      const renderFigure = (item, i) => {
        const src = typeof item === "string" ? item : item.src;
        const caption = typeof item === "object" ? item.caption : null;
        const wide = typeof item === "object" && item.wide;
        const crop = typeof item === "object" && item.crop;
        const cropScale = typeof item === "object" && item.cropScale;
        const isVideo = typeof item === "object" && item.video;
        const autoplay = typeof item === "object" && item.autoplay;
        const cropX = typeof item === "object" && item.cropX;
        const link = typeof item === "object" && item.link;
        const captionLink = typeof item === "object" && item.captionLink;
        const eager = typeof item === "object" && item.eager;
        const grow = typeof item === "object" && item.grow;
        const classes = ["project__figure", wide && "project__figure--wide", crop && "project__figure--crop", cropX && "project__figure--cropx"].filter(Boolean).join(" ");
        const media = isVideo
          ? autoplay
            ? `<video class="project__video" src="${src}" autoplay muted loop playsinline preload="none"></video>`
            : `<video class="project__video" src="${src}" controls playsinline preload="metadata"></video>`
          : `<img loading="${eager ? "eager" : "lazy"}" decoding="async" src="${src}" alt="${project.title} — galleri ${i + 1}">`;
        const figStyle = [
          cropScale ? `--crop-scale:${cropScale}` : (cropX !== true && cropX ? `--crop-scale:${cropX}` : null),
          grow ? `flex:${grow}` : null
        ].filter(Boolean).join(";");
        const figure = `<figure class="${classes}"${figStyle ? ` style="${figStyle}"` : ""}>
          ${media}
          ${caption ? `<figcaption class="project__figcaption">${caption}${captionLink ? ` <a href="${captionLink}" target="_blank" rel="noopener" class="project__figcaption-link">Se nettside →</a>` : ""}</figcaption>` : ""}
        </figure>`;
        return link ? `<a href="${link}" target="_blank" rel="noopener" class="project__figure-link">${figure}</a>` : figure;
      };

      // ── Build gallery source (gallery array, or images if no gallery) ─
      let gallerySource = project.gallery || [];
      if (!gallerySource.length && project.images?.length) {
        gallerySource = project.images.map(src => typeof src === "string" ? { src } : src);
      }

      const galleryHTML = gallerySource.length ? `
        <div class="project__gallery">
          ${gallerySource.map((item, i) => {
            if (item && item.type === "heading") {
              return `<div class="project__gallery-heading">${item.text}</div>`;
            }
            if (item && item.type === "expandable") {
              const coverFig = renderFigure(item.cover, i);
              const restFigs = item.items.map((sub, j) => renderFigure(sub, i + j + 1)).join("");
              return `<div class="gallery-expandable">
                <div class="gallery-expandable__heading">${item.heading}</div>
                <div class="gallery-expandable__strip">
                  <div class="gallery-expandable__cover">${coverFig}</div>
                  <div class="gallery-expandable__rest">${restFigs}</div>
                </div>
                <button class="gallery-expandable__close-btn" aria-label="Lukk">↑&#xFE0E; Lukk</button>
              </div>`;
            }
            if (item && item.type === "row") {
              return `<div class="project__gallery-row">
                ${item.items.map((sub, j) => renderFigure(sub, i + j)).join("")}
              </div>`;
            }
            if (item && item.type === "palette") {
              return `<div class="palette palette--cards" style="column-span:all;margin-bottom:clamp(20px,3vw,36px);grid-template-columns:repeat(${item.colors.length},1fr)">
                ${item.colors.map(c => `
                  <div class="palette__item">
                    <div class="palette__swatch" style="background:${c.color}"></div>
                    <div class="palette__info">
                      <span class="palette__name">${c.name}</span>
                      <span class="palette__hex">${c.hex}</span>
                      ${c.description ? `<span class="palette__desc">${c.description}</span>` : ""}
                    </div>
                  </div>`).join("")}
              </div>`;
            }
            return renderFigure(item, i);
          }).join("")}
        </div>` : "";

      // ══════════════════════════════════════════════════════════════════
      //  PROCESS VIEW
      // ══════════════════════════════════════════════════════════════════
      if (viewProcess) {
        const bgSections = project.background || [];
        const introText = project.processText || project.intro || "";

        const tocHTML = bgSections.length ? `
          <div class="prosess-view__toc">
            ${bgSections.map((s, i) => `
              <div class="prosess-view__toc-item">
                <a href="#ps-${i}">${String(i + 1).padStart(2, "0")}. ${s.heading}</a>
              </div>`).join("")}
          </div>` : "";

        const sectionsHTML = bgSections.map((s, i) => `
          <div class="prosess-view__section" id="ps-${i}">
            <h2 class="prosess-view__section-heading">
              <span class="prosess-view__section-num">${String(i + 1).padStart(2, "0")}.</span>
              ${s.heading}
            </h2>
            <div class="prosess-view__section-body">${renderSectionInner(s)}</div>
          </div>`).join("");

        const processTitle = `PROSESS\n${project.title.toUpperCase()}`;

        $("#project").innerHTML = `
          <div class="prosess-view">
            <h1 class="prosess-view__title">${processTitle.replace("\n", "<br>")}</h1>
            ${introText || tocHTML ? `
            <div class="prosess-view__intro-row">
              <div class="prosess-view__intro-left">
                ${introText ? introText.split("\n\n").map(p => `<p class="prosess-view__intro-text">${p}</p>`).join("") : ""}
              </div>
              <div class="prosess-view__intro-right">
                ${tocHTML}
              </div>
            </div>` : ""}
            <div class="prosess-view__sections">${sectionsHTML}</div>
            <a class="prosess-view__back" href="./project.html?id=${encodeURIComponent(id)}">
              <svg width="9" height="16" viewBox="0 0 9 16" fill="none" aria-hidden="true"><path d="M8 1L1 8L8 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Tilbake til ${project.title}
            </a>
          </div>`;

      // ══════════════════════════════════════════════════════════════════
      //  MAIN PROJECT VIEW
      // ══════════════════════════════════════════════════════════════════
      } else {
        const hasProcess = !!(project.processText || (project.background || []).length);

        const metaHTML = (project.projectMeta || []).length ? `
          <div class="proj-new-pmeta">
            ${(project.projectMeta || []).map(row => `
              <div class="proj-new-pmeta__item">
                <strong class="proj-new-pmeta__label">${row.label}</strong>
                <span class="proj-new-pmeta__value">${row.value}</span>
              </div>`).join("")}
          </div>` : "";

        const introHTML = project.intro ? project.intro.split("\n\n").map(p =>
          `<p class="proj-new-desc">${p.replace(/\n/g, "<br>")}</p>`
        ).join("") : "";

        const scrollGalleriesHTML = (project.scrollGalleries || []).map(g => `
          <div class="scroll-gallery">
            ${g.label ? `<p class="scroll-gallery__label">${g.label}</p>` : ""}
            <p class="scroll-gallery__swipe-hint" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M4 9h10M10 5l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Sveip</p>
            <div class="scroll-gallery__track">
              ${g.images.map(src => `<img class="scroll-gallery__img${g.size === "ipad" ? " scroll-gallery__img--ipad" : g.size === "mobile" ? " scroll-gallery__img--mobile" : ""}" src="${src}" alt="${project.title}" loading="lazy" decoding="async">`).join("")}
            </div>
          </div>`).join("");

        // Related projects
        const others = (window.PROJECTS || []).filter(p => p.id !== project.id).slice(0, 3);
        const relatedHTML = others.length ? `
          <div class="related">
            <h2 class="related__heading">Mer å se på</h2>
            <div class="related__grid">
              ${others.map(p => `
                <a class="related__card" href="./project.html?id=${encodeURIComponent(p.id)}">
                  <img src="${p.cover}" alt="${p.title}" loading="lazy">
                  <p class="related__title">${p.title}</p>
                </a>`).join("")}
            </div>
          </div>` : "";

        $("#project").innerHTML = `
          <!-- Hero: title left, cover image right -->
          <section class="proj-new-hero">
            <div class="proj-new-hero__left">
              <h1 class="proj-new-hero__title">${project.title.toUpperCase()}</h1>
            </div>
            <div class="proj-new-hero__right">
              <img src="${project.cover}" alt="${project.title}" loading="eager" decoding="async">
            </div>
          </section>

          <!-- Meta + description -->
          <section class="proj-new-about">
            <div class="proj-new-about__left">
              ${metaHTML}
              ${hasProcess ? `<a class="btn-pdf btn-pdf--black" href="./project.html?id=${encodeURIComponent(id)}&view=process">Se prosess</a>` : ""}
              ${project.link ? `<a class="btn-pdf btn-pdf--green" href="${project.link.src}" target="_blank" rel="noopener" style="margin-top:10px;display:inline-flex">↗&#xFE0E; ${project.link.label}</a>` : ""}
              ${project.finalPdf ? `<a class="btn-pdf btn-pdf--green" href="${project.finalPdf.src}" target="_blank" rel="noopener" style="margin-top:10px;display:inline-flex">↗&#xFE0E; ${project.finalPdf.label}</a>` : ""}
            </div>
            <div class="proj-new-about__right">
              ${introHTML}
            </div>
          </section>

          <!-- Gallery -->
          ${galleryHTML}
          ${scrollGalleriesHTML}
          ${relatedHTML}
        `;
      }
    }

    // ── Lightbox ─────────────────────────────────────────────────────────
    const lbOverlay = document.getElementById("lbOverlay");
    const lbImg = document.getElementById("lbImg");
    const lbPrev = document.getElementById("lbPrev");
    const lbNext = document.getElementById("lbNext");
    let lbImages = [];
    let lbIndex = 0;

    function openLightbox(src, alt, images, index) {
      lbImg.src = src;
      lbImg.alt = alt || "";
      lbImages = images || [];
      lbIndex = index ?? 0;
      lbPrev.style.display = lbImages.length > 1 ? "" : "none";
      lbNext.style.display = lbImages.length > 1 ? "" : "none";
      lbOverlay.classList.add("lb-open");
    }
    function closeLightbox() {
      lbOverlay.classList.remove("lb-open");
      lbImg.src = "";
    }
    function showLbImage(idx) {
      lbIndex = (idx + lbImages.length) % lbImages.length;
      lbImg.src = lbImages[lbIndex].src;
      lbImg.alt = lbImages[lbIndex].alt || "";
    }

    lbPrev.addEventListener("click", e => { e.stopPropagation(); showLbImage(lbIndex - 1); });
    lbNext.addEventListener("click", e => { e.stopPropagation(); showLbImage(lbIndex + 1); });

    document.addEventListener("click", e => {
      const imgEl = e.target.tagName === "IMG" && (e.target.classList.contains("bg__img") || e.target.closest(".project__figure") || e.target.closest(".prosess-view__section-body")) ? e.target : null;
      if (imgEl) {
        const section = imgEl.closest(".gallery-expandable");
        if (section) {
          const imgs = [...section.querySelectorAll(".project__figure img")];
          const idx = imgs.indexOf(imgEl);
          openLightbox(imgEl.src, imgEl.alt, imgs.map(i => ({ src: i.src, alt: i.alt })), idx);
        } else {
          openLightbox(imgEl.src, imgEl.alt, [], 0);
        }
      } else if (e.target === lbOverlay || e.target.id === "lbClose") {
        closeLightbox();
      }
    });
    document.addEventListener("keydown", e => {
      if (!lbOverlay.classList.contains("lb-open")) return;
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") showLbImage(lbIndex - 1);
      if (e.key === "ArrowRight") showLbImage(lbIndex + 1);
    });

    // ── Expandable gallery sections ───────────────────────────────────────
    document.querySelectorAll(".gallery-expandable__cover").forEach(cover => {
      cover.addEventListener("click", () => {
        const section = cover.closest(".gallery-expandable");
        const wasOpen = section.classList.contains("is-open");
        section.classList.toggle("is-open");
        if (!wasOpen && window.innerWidth <= 780) {
          setTimeout(() => {
            section.querySelector(".gallery-expandable__heading").scrollIntoView({ behavior: "smooth", block: "start" });
          }, 80);
        }
      });
    });
    document.querySelectorAll(".gallery-expandable__close-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const section = btn.closest(".gallery-expandable");
        section.classList.remove("is-open");
        section.querySelector(".gallery-expandable__heading").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });

    // ── Scroll reveal ─────────────────────────────────────────────────────
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.06 });
    document.querySelectorAll(".proj-new-about, .project__gallery, .prosess-view__section, .related").forEach((el, i) => {
      el.classList.add("reveal");
      el.style.transitionDelay = `${Math.min(i, 2) * 0.07}s`;
      revealObserver.observe(el);
    });

    // ── Sidebar mobile toggle ─────────────────────────────────────────────
    const toggle = $("#sidebarToggle");
    toggle?.addEventListener("click", () => {
      const sidebar = $("#sidebar");
      const isOpen = sidebar.classList.toggle("sidebar--open");
      toggle.setAttribute("aria-expanded", String(isOpen));
    });
  </script>
</body>
</html>
